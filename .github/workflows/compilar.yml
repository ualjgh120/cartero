# Compila la app para Mac (.dmg) y Windows (instalador .exe) en los ordenadores
# de GitHub cada vez que se suben cambios. Al crear una etiqueta vX.Y.Z,
# además publica una "Release" con los dos instaladores.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Firma gratuita de SignPath Foundation: solo en versiones (etiquetas
      # vX.Y.Z) y solo si el secreto SIGNPATH_API_TOKEN está puesto. Sin él,
      # todo se compila igual que antes, sin firmar.
      FIRMAR: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas
        # En Windows, PySide6 a veces devuelve un código de salida erróneo al
        # cerrarse aunque todo haya pasado: se decide por el informe JUnit.
        shell: pwsh
        run: |
          python -m pytest pruebas -q -p no:warnings --junitxml=pruebas.xml
          python -c "import xml.etree.ElementTree as E,sys; s=E.parse('pruebas.xml').getroot(); s=s if s.tag=='testsuite' else s[0]; m=int(s.get('failures'))+int(s.get('errors')); print('fallos+errores:',m, 'de', s.get('tests')); sys.exit(1 if m or int(s.get('tests'))==0 else 0)"
          exit $LASTEXITCODE
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Icono
        run: python empaquetado/icono.py
      - name: Compilar .exe
        run: python -m PyInstaller empaquetado/app.spec --noconfirm
      - name: Autoprueba del .exe ya empaquetado
        shell: pwsh
        run: |
          $nombre = python -c "from nucleo.config import NOMBRE_APP; print(NOMBRE_APP)"
          python -c "import sys; sys.path[:0]=['pruebas']; from utiles import factura_ejidosoft; factura_ejidosoft('prueba.pdf', 'AGRICOLA FERVALIA S.L.')"
          $p = Start-Process -FilePath "dist\$nombre\$nombre.exe" -Wait -PassThru -ArgumentList @("--autoprueba", "prueba.pdf", "--salida", "autoprueba.txt")
          Get-Content autoprueba.txt
          if ($p.ExitCode -ne 0) { throw "La autoprueba del .exe ha fallado" }
      - name: Subir el .exe para firmarlo
        if: env.FIRMAR == 'true'
        id: sin_firmar_app
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-app
          path: dist/*/*.exe
      - name: Firmar el .exe (SignPath)
        if: env.FIRMAR == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.sin_firmar_app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmado-app
      - name: Colocar el .exe firmado
        if: env.FIRMAR == 'true'
        shell: pwsh
        run: |
          Get-ChildItem firmado-app -Filter *.exe | ForEach-Object {
            $destino = Get-ChildItem -Path (Split-Path "dist/*/*.exe") -Filter $_.Name
            Copy-Item $_.FullName $destino.FullName -Force
            $firma = Get-AuthenticodeSignature $destino.FullName
            Write-Host "$($destino.Name): $($firma.Status) - $($firma.SignerCertificate.Subject)"
            if ($firma.Status -ne 'Valid') { throw "La firma de $($destino.Name) no es válida" }
          }
      - name: Instalador
        shell: pwsh
        run: |
          $nombre = python -c "from nucleo.config import NOMBRE_APP; print(NOMBRE_APP)"
          $version = python -c "from nucleo.config import VERSION; print(VERSION)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DNombre=$nombre" "/DVersion=$version" empaquetado\instalador.iss
      - name: Subir el instalador para firmarlo
        if: env.FIRMAR == 'true'
        id: sin_firmar_instalador
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-instalador
          path: dist/*-Windows-instalador.exe
      - name: Firmar el instalador (SignPath)
        if: env.FIRMAR == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.sin_firmar_instalador.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: firmado-instalador
      - name: Colocar el instalador firmado
        if: env.FIRMAR == 'true'
        shell: pwsh
        run: |
          Get-ChildItem firmado-instalador -Filter *.exe | ForEach-Object {
            $destino = Get-ChildItem -Path (Split-Path "dist/*-Windows-instalador.exe") -Filter $_.Name
            Copy-Item $_.FullName $destino.FullName -Force
            $firma = Get-AuthenticodeSignature $destino.FullName
            Write-Host "$($destino.Name): $($firma.Status) - $($firma.SignerCertificate.Subject)"
            if ($firma.Status -ne 'Valid') { throw "La firma de $($destino.Name) no es válida" }
          }
      - name: Paquete MSIX para la Microsoft Store
        shell: pwsh
        env:
          MSIX_IDENTIDAD: ${{ vars.MSIX_IDENTIDAD }}
          MSIX_EDITOR: ${{ vars.MSIX_EDITOR }}
          MSIX_NOMBRE_EDITOR: ${{ vars.MSIX_NOMBRE_EDITOR }}
          MSIX_NOMBRE_TIENDA: ${{ vars.MSIX_NOMBRE_TIENDA }}
        run: |
          $nombre = python -c "from nucleo.config import NOMBRE_APP; print(NOMBRE_APP)"
          $version = python -c "from nucleo.config import VERSION; print(VERSION)"
          python empaquetado/msix.py
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /o /d build\msix /p "dist\$nombre-$version.msix"
          if ($LASTEXITCODE -ne 0) { throw "makeappx ha fallado" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-Windows-instalador.exe
            dist/*.msix
            autoprueba.txt

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest pruebas -q -p no:warnings
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Compilar .app y .dmg
        run: PY=python bash empaquetado/compilar_mac.sh
      - name: Autoprueba de la .app ya empaquetada
        run: |
          N=$(python -c "from nucleo.config import NOMBRE_APP; print(NOMBRE_APP)")
          python -c "import sys; sys.path[:0]=['pruebas']; from utiles import factura_ejidosoft; factura_ejidosoft('prueba.pdf', 'AGRICOLA FERVALIA S.L.')"
          "dist/$N.app/Contents/MacOS/$N" --autoprueba prueba.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/*.exe
            mac/*.dmg
